name: COSMIC
on:
  pull_request:
    paths: &theme_paths
      - 'src/**'
      - 'manifest.json'
      - 'README.md'
      - 'logo.png'
      - 'stylelint.config.mjs'
      - 'no-css-comments.yml'
      - 'releases/cosmic-*.zip'
      - 'package*.json'
      - '.npmrc'
      - '.node-version'
      - '.github/workflows/cosmic.yml'
  push:
    branches: [master]
    paths: *theme_paths
permissions:
  contents: read
concurrency:
  group: cosmic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run build
      - name: Compare release contents with the build
        run: |
          version=$(jq -r '.version | [.major,.minor,.patch] | join(".")' manifest.json)
          unzip -q dist/cosmic.zip -d "$RUNNER_TEMP/build"
          unzip -q "releases/cosmic-$version.zip" -d "$RUNNER_TEMP/release"
          diff -r "$RUNNER_TEMP/build" "$RUNNER_TEMP/release"
